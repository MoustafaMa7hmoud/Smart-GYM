<app-navbar></app-navbar>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">⚡ CORE-X</div>
    <h2 class="auth-title">Create Account</h2>
    <div class="steps"><div class="step" [class.active]="step>=1">1</div><div class="step-line"></div><div class="step" [class.active]="step>=2">2</div></div>

    <div class="error-msg" *ngIf="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>

    <!-- Step 1 -->
    <div *ngIf="step===1">
      <div class="form-group"><label>Full Name</label><input type="text" [(ngModel)]="fullName" placeholder="Ahmed Mohamed" /></div>
      <div class="form-group"><label>Email Address</label><input type="email" [(ngModel)]="email" placeholder="you@example.com" /></div>
      <div class="form-group"><label>Password</label><input type="password" [(ngModel)]="password" placeholder="Min 8 characters" /></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" [(ngModel)]="confirmPassword" placeholder="Repeat password" /></div>
      <button class="btn btn-full" (click)="nextStep()">Continue <i class="fas fa-arrow-right"></i></button>
    </div>

    <!-- Step 2 -->
    <div *ngIf="step===2">
      <div class="form-group"><label>Phone Number</label><input type="tel" [(ngModel)]="phone" placeholder="01012345678" /></div>
      <div class="form-group">
        <label>Gender</label>
        <select [(ngModel)]="gender">
          <option value="" disabled>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="form-group"><label>Date of Birth</label><input type="date" [(ngModel)]="dateOfBirth" /></div>
      <div class="btn-row">
        <button class="btn btn-outline" (click)="step=1; error=''"><i class="fas fa-arrow-left"></i> Back</button>
        <button class="btn" (click)="onSubmit()" [disabled]="loading">
          <span *ngIf="!loading">Register <i class="fas fa-check"></i></span>
          <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i></span>
        </button>
      </div>
    </div>

    <p class="auth-footer">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
<app-footer></app-footer>
