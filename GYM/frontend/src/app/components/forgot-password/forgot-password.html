<app-navbar></app-navbar>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">⚡ CORE-X</div>

    <div *ngIf="!sent">
      <h2 class="auth-title">Forgot Password?</h2>
      <p class="auth-sub">Enter your email and we'll send you a reset link</p>

      <div class="error-msg" *ngIf="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" placeholder="you@example.com" (keyup.enter)="onSubmit()" />
      </div>

      <button class="btn btn-full" (click)="onSubmit()" [disabled]="loading">
        <span *ngIf="!loading"><i class="fas fa-paper-plane"></i> Send Reset Link</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i> Sending...</span>
      </button>
    </div>

    <div *ngIf="sent" class="success-state">
      <div class="success-icon"><i class="fas fa-envelope-open-text"></i></div>
      <h3>Check your inbox!</h3>
      <p>We sent a password reset link to <strong>{{ email }}</strong></p>
      <p class="note">Didn't receive it? Check spam or <button class="link-btn" (click)="sent=false">try again</button></p>
    </div>

    <p class="auth-footer"><a routerLink="/login"><i class="fas fa-arrow-left"></i> Back to login</a></p>
  </div>
</div>
<app-footer></app-footer>
